<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survival Wheel</title>
<style>
:root{--bg:#0f0f11;--panel:#16161a;--line:#2b2b33;--pink:#ff69b4;--pink2:#ff479d;--neon:#ff007f;--text:#ffffff;--muted:#a0a0aa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(1100px 700px at 30% 40%,#2a0f20 0%,var(--bg) 70%);color:var(--text);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
#banner{display:none;background:var(--neon);color:#fff;font-weight:800;font-size:1.15rem;padding:10px 0;overflow:hidden;white-space:nowrap;border-bottom:2px solid var(--pink)}
#banner.on{display:block}
#banner span{display:inline-block;padding-left:100%;animation:scroll 16s linear infinite}
@keyframes scroll{to{transform:translateX(-100%)}}
#stage{flex:1;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:20px;padding:20px;min-height:0}
#left{position:relative;min-height:0;display:flex;align-items:center;justify-content:center}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block}
#result{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(15,15,17,.92);border:2px solid var(--neon);border-radius:14px;padding:12px 26px;font-size:clamp(1.3rem,3vw,2.4rem);font-weight:900;text-align:center;box-shadow:0 0 40px rgba(255,0,127,.55);display:none;max-width:90%}
#result.on{display:block}
#result small{display:block;color:var(--muted);font-size:.45em;font-weight:700;margin-bottom:2px}
#result b{color:var(--pink)}
#sound{position:absolute;top:0;left:0;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;font-size:.85rem;cursor:pointer}
#sound.done{display:none}
#entryPill{position:absolute;top:0;right:0;background:rgba(22,22,26,.92);border:1.5px solid var(--neon);border-radius:14px;padding:8px 16px;text-align:right;box-shadow:0 0 24px rgba(255,0,127,.35)}
#pillMain{display:block;font-size:clamp(1rem,2vw,1.6rem);font-weight:900;color:#fff}
#pillReg{display:block;font-size:.8rem;font-weight:700;color:var(--muted)}
#pillReg.open{color:var(--pink)}
#pillReg:empty{display:none}
#entryPill.bump{animation:bump .6s ease}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.12);box-shadow:0 0 40px rgba(255,0,127,.8)}100%{transform:scale(1)}}
#right{background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#right header{padding:16px 20px;border-bottom:1px solid var(--line)}
#right h2{margin:0;font-size:1.5rem;font-weight:900;letter-spacing:.04em;color:var(--pink2);text-shadow:0 0 18px rgba(255,0,127,.5)}
#count{color:var(--muted);margin-top:4px;font-size:.95rem}
#log{list-style:none;margin:0;padding:10px 12px;overflow-y:auto;flex:1}
#log li{padding:8px 10px;border-radius:8px;font-size:1.15rem;font-weight:700;display:flex;gap:10px;align-items:baseline;overflow-wrap:anywhere}
#log li:nth-child(odd){background:rgba(255,255,255,.03)}
#log .tag{color:var(--pink);font-size:.85em;flex:none}
#log li.out{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--neon);text-decoration-thickness:2px}
#log li.out .tag{color:var(--neon)}
#log li.win{background:rgba(255,0,127,.2);color:#fff;box-shadow:inset 0 0 0 1px var(--neon)}
#log li.win .tag{color:#fff}
#log .empty{color:var(--muted);font-weight:500}
@media (max-width:820px){#stage{grid-template-columns:1fr;grid-template-rows:minmax(0,1.3fr) minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){#banner span{animation:none;padding-left:12px}}
</style>
</head>
<body>
<div id="banner" role="alert"><span id="bannerText"></span></div>
<div id="stage">
  <section id="left">
    <div id="wrap"><canvas id="wheel" aria-label="Survival wheel"></canvas></div>
    <button id="sound" type="button">🔊 Enable sound</button>
    <div id="entryPill" aria-live="polite"><span id="pillMain">0 entered</span><span id="pillReg"></span></div>
    <div id="result" aria-live="assertive"></div>
  </section>
  <aside id="right">
    <header><h2>SURVIVAL LOG</h2><div id="count">Waiting for entries</div></header>
    <ul id="log"></ul>
  </aside>
</div>
<script>
(function () {
  var TAU = Math.PI * 2;
  var COLORS = ['#ff007f', '#ff479d', '#c2185b', '#ff69b4', '#d81b78'];
  var canvas = document.getElementById('wheel');
  var ctx = canvas.getContext('2d');
  var wrap = document.getElementById('wrap');
  var logEl = document.getElementById('log');
  var countEl = document.getElementById('count');
  var resultEl = document.getElementById('result');
  var banner = document.getElementById('banner');
  var bannerText = document.getElementById('bannerText');
  var rolling = new Audio('audio/rolling.mp3');
  var victory = new Audio('audio/victory.mp3');
  rolling.loop = true; rolling.preload = 'auto'; victory.preload = 'auto';

  var entries = [], segs = [], eliminated = new Set();
  var registration = 'none', lastTotal = null;
  var pill = document.getElementById('entryPill');
  var pillMain = document.getElementById('pillMain');
  var pillReg = document.getElementById('pillReg');

  function updatePill() {
    var total = entries.length;
    var alive = entries.filter(function (e) { return e.status === 'alive' && !eliminated.has(e.name); }).length;
    pillMain.textContent = eliminated.size ? alive + ' alive of ' + total : total + ' entered';
    pillReg.textContent = registration === 'open' ? '● Registration open' : registration === 'closed' ? 'Registration closed' : '';
    pillReg.className = registration;
    if (lastTotal !== null && total > lastTotal) {
      pill.classList.remove('bump');
      void pill.offsetWidth;
      pill.classList.add('bump');
    }
    lastTotal = total;
  }
  var theta = -Math.PI / 2, flick = 0, size = 600;
  var spinning = false, busy = false, lastSpin = null, lastSig = '';

  function rand() { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }
  function mod(x, m) { return ((x % m) + m) % m; }

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    size = Math.max(240, Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight)));
    canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
    canvas.width = Math.floor(size * dpr); canvas.height = Math.floor(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function draw() {
    var s = size, cx = s / 2, cy = s / 2 + s * 0.02, R = s / 2 - s * 0.06;
    ctx.clearRect(0, 0, s, s);
    ctx.save();
    ctx.shadowColor = '#ff007f'; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.arc(cx, cy, R + 6, 0, TAU);
    ctx.fillStyle = '#16161a'; ctx.fill();
    ctx.lineWidth = 6; ctx.strokeStyle = '#ff69b4'; ctx.stroke();
    ctx.restore();

    if (!segs.length) {
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fillStyle = '#0f0f11'; ctx.fill();
      ctx.fillStyle = '#a0a0aa'; ctx.font = '700 ' + Math.round(s * 0.05) + 'px "Avenir Next","Segoe UI",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('No entries yet', cx, cy);
    } else {
      var n = segs.length, a = TAU / n;
      var fs = Math.max(9, Math.min(R * 0.1, a * R * 0.5));
      for (var i = 0; i < n; i++) {
        var start = theta + i * a;
        ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, start, start + a); ctx.closePath();
        ctx.fillStyle = COLORS[i % COLORS.length]; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#0f0f11'; ctx.stroke();
        ctx.save();
        ctx.translate(cx, cy); ctx.rotate(start + a / 2);
        ctx.fillStyle = '#ffffff'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
        ctx.font = '800 ' + fs + 'px "Avenir Next","Segoe UI",sans-serif';
        ctx.fillText(segs[i].name, R - R * 0.06, 0, R * 0.72);
        ctx.restore();
      }
    }

    ctx.beginPath(); ctx.arc(cx, cy, R * 0.11, 0, TAU);
    ctx.fillStyle = '#0f0f11'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#ff007f'; ctx.stroke();

    ctx.save();
    ctx.translate(cx, cy - R - 4);
    ctx.rotate(flick * 0.4);
    ctx.beginPath(); ctx.moveTo(-R * 0.06, -R * 0.02); ctx.lineTo(R * 0.06, -R * 0.02); ctx.lineTo(0, R * 0.14); ctx.closePath();
    ctx.fillStyle = '#ffffff'; ctx.shadowColor = '#ff007f'; ctx.shadowBlur = 16; ctx.fill();
    ctx.restore();
  }

  function indexAtPointer() {
    if (!segs.length) return -1;
    var a = TAU / segs.length;
    return Math.floor(mod(-Math.PI / 2 - theta, TAU) / a) % segs.length;
  }

  function rebuildSegs(target) {
    segs = entries.filter(function (e) {
      return (e.status === 'alive' && !eliminated.has(e.name)) || (target && e.name === target);
    });
  }

  function renderLog() {
    var sig = entries.map(function (e) { return e.name + ':' + e.status + ':' + (eliminated.has(e.name) ? 1 : 0); }).join('|');
    if (sig === lastSig) return;
    lastSig = sig;
    logEl.textContent = '';
    var alive = 0;
    if (!entries.length) {
      var li0 = document.createElement('li'); li0.className = 'empty'; li0.textContent = 'No one has entered yet.';
      logEl.appendChild(li0);
    }
    entries.forEach(function (e) {
      var li = document.createElement('li'), tag = document.createElement('span'), nm = document.createElement('span');
      tag.className = 'tag'; nm.textContent = e.name;
      if (e.status === 'winner') { li.className = 'win'; tag.textContent = '[WINNER]'; }
      else if (eliminated.has(e.name)) { li.className = 'out'; tag.textContent = '[OUT]'; }
      else { tag.textContent = '[ALIVE]'; alive++; }
      li.appendChild(tag); li.appendChild(nm); logEl.appendChild(li);
    });
    countEl.textContent = entries.length ? alive + ' alive of ' + entries.length : 'Waiting for entries';
  }

  function showResult(label, name) {
    resultEl.textContent = '';
    var small = document.createElement('small'); small.textContent = label;
    var b = document.createElement('b'); b.textContent = name;
    resultEl.appendChild(small); resultEl.appendChild(b); resultEl.classList.add('on');
  }
  function hideResult() { resultEl.classList.remove('on'); }

  function startSpin(mode, target) {
    hideResult();
    rebuildSegs(mode === 'spin_winner' ? target : null);
    if (!segs.length) return;
    spinning = true; busy = true;
    var n = segs.length, a = TAU / n;
    var j = mode === 'spin_winner' ? segs.findIndex(function (e) { return e.name === target; }) : Math.floor(rand() * n);
    if (j < 0) j = Math.floor(rand() * n);
    var jitter = (rand() - 0.5) * a * 0.6;
    var want = mod(-Math.PI / 2 - (j + 0.5) * a - jitter, TAU);
    var delta = mod(want - mod(theta, TAU), TAU);
    var D = delta + TAU * (12 + Math.floor(rand() * 4));
    var tau = 1.8, T = tau * 7, th0 = theta;
    var norm = 1 - Math.exp(-T / tau);
    var t0 = performance.now(), lastIdx = indexAtPointer();
    rolling.currentTime = 0; rolling.volume = 1;
    var p = rolling.play(); if (p && p.catch) p.catch(function () {});

    function frame(now) {
      var t = Math.min((now - t0) / 1000, T);
      theta = th0 + D * (1 - Math.exp(-t / tau)) / norm;
      var w = (D / tau) * Math.exp(-t / tau) / norm;
      rolling.volume = Math.max(0.15, Math.min(1, w / 12));
      rolling.playbackRate = Math.max(0.7, Math.min(1.3, 0.7 + w / 40));
      var idx = indexAtPointer();
      if (idx !== lastIdx) { flick = 1; lastIdx = idx; }
      flick *= 0.82;
      draw();
      if (t < T) { requestAnimationFrame(frame); return; }
      theta = th0 + D; flick = 0; draw();
      rolling.pause();
      land(mode, segs[j].name);
    }
    requestAnimationFrame(frame);
  }

  function land(mode, name) {
    spinning = false;
    if (mode === 'spin_winner') {
      victory.currentTime = 0; victory.volume = 1;
      var p = victory.play(); if (p && p.catch) p.catch(function () {});
      showResult('WINNER', name);
      busy = false; renderLog(); updatePill();
    } else {
      eliminated.add(name);
      showResult('OUT', name);
      renderLog();
      updatePill();
      setTimeout(function () { rebuildSegs(null); busy = false; draw(); }, 2400);
    }
  }

  function applyAlerts(alerts) {
    if (alerts && alerts.length) {
      var text = alerts.map(function (a) { return a.message; }).join('     •     ');
      if (bannerText.textContent !== text) bannerText.textContent = text;
      banner.classList.add('on');
    } else {
      banner.classList.remove('on'); bannerText.textContent = '';
    }
  }

  async function poll() {
    try {
      var res = await fetch('/api/public-list', { cache: 'no-store' });
      if (!res.ok) return;
      var d = await res.json();
      if (!d.ok) return;
      if (d.force_reset && eliminated.size) { eliminated.clear(); lastSig = ''; hideResult(); }
      if (d.force_reset) hideResult();
      entries = d.entries || [];
      registration = d.registration || 'none';
      applyAlerts(d.alerts);
      renderLog();
      updatePill();
      if (lastSpin === null) lastSpin = d.spin_id;
      if (!busy) { rebuildSegs(null); draw(); }
      if (!busy && d.spin_id > lastSpin && (d.command === 'spin_winner' || d.command === 'spin_elim')) {
        lastSpin = d.spin_id;
        startSpin(d.command, d.target);
      } else if (d.spin_id < lastSpin) {
        lastSpin = d.spin_id;
      }
    } catch (_) {}
  }

  document.getElementById('sound').addEventListener('click', function () {
    [rolling, victory].forEach(function (a) {
      a.muted = true;
      var p = a.play();
      var done = function () { a.pause(); a.currentTime = 0; a.muted = false; };
      if (p && p.then) p.then(done).catch(function () { a.muted = false; }); else done();
    });
    this.classList.add('done');
  });

  window.addEventListener('resize', resize);
  resize();
  poll();
  setInterval(poll, 2000);
})();
</script>
</body>
</html>
