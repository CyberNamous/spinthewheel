<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Live Wheel Spin</title>
  <style>
    :root {
      --bg: #0f0f11;
      --panel: #16161a;
      --panel-2: #1d1d23;
      --line: #2a2a33;
      --pink: #ff69b4;
      --pink-2: #ff479d;
      --magenta: #ff007f;
      --white: #ffffff;
      --silver: #a0a0aa;
      --alert: #ff1744;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 20%, rgba(255, 0, 127, 0.2), transparent 50%),
        radial-gradient(circle at 90% 90%, rgba(255, 105, 180, 0.12), transparent 45%),
        var(--bg);
      color: var(--white);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    }
    .marquee {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      height: 54px;
      display: none;
      align-items: center;
      overflow: hidden;
      background: linear-gradient(90deg, #5c0016, var(--alert), #5c0016);
      border-bottom: 2px solid #ff8a9b;
      box-shadow: 0 0 34px rgba(255, 23, 68, 0.75);
    }
    .marquee.show { display: flex; }
    .marquee span {
      display: inline-block;
      white-space: nowrap;
      padding-left: 100%;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.55);
      animation: scroll var(--marquee-time, 14s) linear infinite, flash 0.9s steps(2, jump-none) infinite;
    }
    @keyframes scroll { to { transform: translateX(-100%); } }
    @keyframes flash { 50% { color: #ffe3e8; } }

    .stage {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap: 26px;
      padding: 26px;
      transition: padding-top 0.2s;
    }
    body.has-alert .stage { padding-top: 80px; }
    .wheel-zone {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
    }
    .title { text-align: center; margin-bottom: 8px; }
    .title h1 {
      font-size: clamp(1.4rem, 3.2vw, 2.7rem);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--pink), var(--magenta));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 14px rgba(255, 0, 127, 0.55));
    }
    .title p { color: var(--silver); font-size: 1rem; letter-spacing: 0.08em; }
    .wheel-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wheel-box {
      position: relative;
      width: min(100%, calc(100vh - 190px));
      aspect-ratio: 1 / 1;
    }
    #wheelCanvas {
      display: block;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 40px rgba(255, 0, 127, 0.45));
    }
    body.has-alert .wheel-box { width: min(100%, calc(100vh - 270px)); }
    .pointer {
      position: absolute;
      left: 50%;
      top: -10px;
      width: 0;
      height: 0;
      margin-left: -22px;
      border-left: 22px solid transparent;
      border-right: 22px solid transparent;
      border-top: 46px solid var(--white);
      filter: drop-shadow(0 0 10px var(--magenta));
      transform-origin: 50% 0;
      z-index: 5;
    }
    .pointer.tick { animation: tick 0.12s ease-out; }
    @keyframes tick { 40% { transform: rotate(-14deg); } }
    .status-line {
      margin-top: 6px;
      min-height: 1.7em;
      color: var(--pink);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .log {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 0 0 1px rgba(255, 71, 157, 0.1), 0 20px 60px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }
    .log header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(90deg, rgba(255, 0, 127, 0.25), transparent);
    }
    .log h2 { font-size: 1.3rem; letter-spacing: 0.2em; color: var(--pink); }
    .counts { margin-top: 4px; color: var(--silver); font-size: 0.9rem; }
    .counts b { color: var(--white); }
    #logList { flex: 1; overflow-y: auto; list-style: none; padding: 10px 14px 18px; scrollbar-width: thin; scrollbar-color: var(--magenta) transparent; }
    #logList li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      margin-bottom: 4px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 600;
      word-break: break-all;
    }
    #logList li.alive { background: rgba(255, 105, 180, 0.07); }
    #logList li.alive .tag { color: #4dffb0; }
    #logList li.out { color: #6c6c77; text-decoration: line-through; text-decoration-color: var(--alert); text-decoration-thickness: 2px; }
    #logList li.out .tag { color: var(--alert); text-decoration: none; }
    #logList li.flash { animation: glow 1.6s ease-out; }
    @keyframes glow { 0% { background: rgba(255, 0, 127, 0.7); } 100% { background: rgba(255, 105, 180, 0.07); } }
    .tag { flex: none; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.06em; text-decoration: none; display: inline-block; }
    .empty { color: var(--silver); text-align: center; padding: 30px 10px; }

    .card-overlay {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(8, 8, 10, 0.8);
      backdrop-filter: blur(6px);
    }
    .card-overlay.show { display: flex; animation: fade 0.35s ease-out; }
    @keyframes fade { from { opacity: 0; } }
    .result-card {
      text-align: center;
      padding: 44px 70px;
      border-radius: 30px;
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      border: 3px solid var(--magenta);
      box-shadow: 0 0 80px rgba(255, 0, 127, 0.65);
      animation: pop 0.5s cubic-bezier(0.2, 1.4, 0.4, 1);
      max-width: 92vw;
    }
    .result-card.out-card { border-color: var(--alert); box-shadow: 0 0 80px rgba(255, 23, 68, 0.6); }
    @keyframes pop { from { transform: scale(0.6); opacity: 0; } }
    .result-card .label { color: var(--pink); font-size: 1.4rem; font-weight: 800; letter-spacing: 0.35em; text-transform: uppercase; }
    .result-card.out-card .label { color: var(--alert); }
    .result-card .name { margin: 14px 0 6px; font-size: clamp(2.4rem, 7vw, 6rem); font-weight: 900; line-height: 1.05; word-break: break-all; }
    .result-card .sub { color: var(--silver); font-size: 1.2rem; }

    .start-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(8, 8, 10, 0.94);
    }
    .start-overlay.hide { display: none; }
    .start-btn {
      border: none;
      border-radius: 18px;
      padding: 20px 44px;
      font: inherit;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--white);
      background: linear-gradient(90deg, var(--magenta), var(--pink-2));
      box-shadow: 0 0 40px rgba(255, 0, 127, 0.55);
      cursor: pointer;
    }
    .start-note { margin-top: 16px; text-align: center; color: var(--silver); }

    @media (max-width: 1000px) {
      body { overflow: auto; }
      .stage { grid-template-columns: 1fr; height: auto; }
      .wheel-box { width: min(100%, 90vw); }
      .log { max-height: 60vh; }
    }
  </style>
</head>
<body>
  <div class="marquee" id="marquee" role="alert"><span id="marqueeText"></span></div>

  <main class="stage">
    <section class="wheel-zone">
      <div class="title">
        <h1>Wheel Spin</h1>
        <p id="subtitle">Waiting for the host</p>
      </div>
      <div class="wheel-wrap">
        <div class="wheel-box">
          <div class="pointer" id="pointer"></div>
          <canvas id="wheelCanvas" width="900" height="900" aria-label="Spinning prize wheel"></canvas>
        </div>
      </div>
      <div class="status-line" id="statusLine"></div>
    </section>

    <aside class="log">
      <header>
        <h2>SURVIVAL LOG</h2>
        <div class="counts"><b id="aliveCount">0</b> alive &middot; <b id="outCount">0</b> out</div>
      </header>
      <ul id="logList"></ul>
    </aside>
  </main>

  <div class="card-overlay" id="cardOverlay">
    <div class="result-card" id="resultCard">
      <div class="label" id="cardLabel"></div>
      <div class="name" id="cardName"></div>
      <div class="sub" id="cardSub"></div>
    </div>
  </div>

  <div class="start-overlay" id="startOverlay">
    <div>
      <button type="button" class="start-btn" id="startBtn">START BROADCAST</button>
      <p class="start-note">Tap once to unlock sound for the drumroll and victory theme.</p>
    </div>
  </div>

  <script src="js/wheel-engine.js"></script>
</body>
</html>
